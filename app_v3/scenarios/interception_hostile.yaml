id: interception_hostile
titre: Interception d'un hostile
niveau: Avancé
duree_s: 780
resume: Une vedette rapide fonce sur le guide et corrige sa route à chaque manœuvre. Détacher une escorte pour la repousser. Une seconde arrive ensuite de l'autre bord.
briefing: >
  Situation : une vedette hostile (TRK031) approche à 30 nœuds et vise le guide. Elle suit vos changements de route :
  manœuvrer la force ne suffit pas. Mission : la classer, puis détacher une escorte pour lui barrer la route.
  Une escorte qui reste à moins de 1 NM de la vedette pendant 20 secondes la fait renoncer.
  Si la vedette arrive à moins de 0,8 NM du guide, la force est atteinte. Après la première, une seconde vedette arrive de l'autre bord.
formation_depart: column
cap_initial: 0
vitesse_initiale_kn: 12
flotte:
  - { nom: hannibal, role: guide }
  - { nom: alfa, role: escorte }
  - { nom: charlie, role: escorte }
  - { nom: delta, role: escorte }
evenements:
  - { t: 20, piste: { id: TRK031, type: Surface, rel: 70, dist_nm: 3.5, cap: 250, vit_kn: 30, cls_reel: hostile, comportement: intercepte,
                      echec_dist_nm: 0.8, blocage_nm: 1.0, blocage_s: 20, rapports_nm: [3.2, 2.2, 1.4] } }
  - { apres_repousse: TRK031, delai_s: 35,
      piste: { id: TRK032, type: Surface, rel: 250, dist_nm: 3.2, cap: 70, vit_kn: 32, cls_reel: hostile, comportement: intercepte,
               echec_dist_nm: 0.8, blocage_nm: 1.0, blocage_s: 20, rapports_nm: [3.0, 2.0, 1.3] } }
attendu:
  - { avant_t: 90, classe: TRK031, cls: hostile, texte: "Classer TRK031 hostile" }
  - { repousse: TRK031, texte: "Repousser TRK031 avec une escorte" }
  - { repousse: TRK032, texte: "Repousser TRK032 avec une escorte" }
  - { garde_nm: 0.8, piste: TRK031, texte: "Garder TRK031 à plus de 0,8 NM du guide" }
