<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hannibal · Vue 3D</title><link rel="stylesheet" href="/static/app.css"><link rel="icon" href="/static/favicon.svg">
<style>
html,body{overflow:hidden;background:#05090f}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:3;pointer-events:none}
.hud>*{pointer-events:auto}
.glass{background:#08101dcc;border:1px solid #23344f;border-radius:10px;backdrop-filter:blur(6px)}
#top{top:14px;left:16px;right:16px;display:flex;gap:10px;align-items:flex-start}
#brand{padding:9px 14px;white-space:nowrap;min-width:230px}
#brand b{letter-spacing:.14em;font-size:13px}#brand span{color:var(--mut);font-size:12px;display:block;margin-top:1px}
#clock{padding:9px 14px;font-size:15px}
#tape{margin:0 auto;padding:6px 10px 4px;text-align:center}
#tape canvas{display:block;width:380px;height:30px}
#tools{display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.tb{border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600;color:#b9c7de}
.tb:hover{background:#13213a}.tb.on{background:#16294a;border-color:#3b6fb5;color:#fff}
#info{left:16px;top:100px;width:230px;padding:12px 14px}
#info .n{font-size:17px;font-weight:700;letter-spacing:.06em}#info .r{color:var(--mut);font-size:12px;margin-bottom:8px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}#info dt{color:var(--mut)}#info dd{margin:0;text-align:right;font-family:"Cascadia Mono",Consolas,monospace}
#radio{left:16px;bottom:74px;max-width:520px;padding:10px 14px;font-size:13px;display:none}
#radio .h{color:var(--mut);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
#radio .en{font-family:"Cascadia Mono",Consolas,monospace}#radio .fr{color:#9fe3d8;margin-top:3px}
#bar{left:16px;right:16px;bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid #23344f;background:#08101dcc;border-radius:9px;padding:6px 12px;text-align:left;min-width:118px;backdrop-filter:blur(6px)}
.pill b{display:block;font-size:12px;letter-spacing:.06em}.pill small{color:var(--mut);font-family:"Cascadia Mono",Consolas,monospace;font-size:11px}
.pill.on{border-color:#4aa3ff;box-shadow:0 0 0 1px #4aa3ff inset}.pill.me b{color:var(--green)}
.pill.hostile b{color:var(--red)}.pill.inconnu b{color:var(--amber)}.pill.neutre b{color:var(--teal)}.pill.ami b{color:var(--blue)}
#state{margin-left:auto;padding:7px 12px;font-size:12px;color:var(--mut)}
.tag{position:fixed;z-index:2;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;text-align:center;font-size:11px;letter-spacing:.06em;color:#dfe9f7;text-shadow:0 1px 3px #000c}
.tag i{display:block;width:1px;height:22px;background:#ffffff66;margin:3px auto 0}
.tag span{display:inline-block;padding:3px 8px;border:1px solid #ffffff40;border-radius:5px;background:#06101dbb}
.tag b{font-weight:600}.tag small{display:block;color:#b7c5db;font-family:"Cascadia Mono",Consolas,monospace;font-size:10px;margin-top:1px}
.tag.me span{border-color:var(--green);color:var(--green)}.tag.sel span{background:#12305a}
.tag.hostile span{border-color:var(--red);color:var(--red)}.tag.inconnu span{border-color:var(--amber);color:var(--amber)}.tag.neutre span{border-color:var(--teal);color:var(--teal)}.tag.ami span{border-color:var(--blue);color:var(--blue)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:#05090f;color:#e3ebf8;text-align:center;padding:30px}
body.clean .hud,body.clean .tag{display:none!important}
.tag,.tag *{font-family:"Segoe UI",system-ui,sans-serif!important;font-variant-numeric:tabular-nums;letter-spacing:.03em}
</style>
<script type="importmap">{"imports":{"three":"/static/vendor/three.module.min.js"}}</script>
</head><body>
<canvas id="gl"></canvas>
<div class="hud" id="top">
  <div class="glass" id="brand"><b>HANNIBAL</b><span id="sc">Vue 3D</span></div>
  <div class="glass mono" id="clock">00:00</div>
  <div class="glass" id="tape"><canvas id="tp" width="760" height="60"></canvas></div>
  <div class="glass" id="tools">
    <button class="tb on" data-cam="orbit" title="Touche 1">Orbite</button><button class="tb" data-cam="chase" title="Touche 2">Poursuite</button>
    <button class="tb" data-cam="bridge" title="Touche 3">Passerelle</button><button class="tb" data-cam="fleet" title="Touche 4">Flotte</button>
    <button class="tb" data-cam="top" title="Touche 5">Tactique</button>
    <button class="tb" id="amb" title="Ambiance">Jour</button><button class="tb" id="lab" title="Étiquettes (L)">Étiquettes</button>
    <button class="tb" id="full" title="Plein écran (F)">Plein écran</button><button class="tb" id="cons">Console</button>
  </div>
</div>
<div class="hud glass" id="info"><div class="n" id="in">—</div><div class="r" id="ir"></div><dl id="id"></dl></div>
<div class="hud glass" id="radio"><div class="h" id="rh"></div><div class="en" id="ren"></div><div class="fr" id="rfr"></div></div>
<div class="hud" id="bar"></div>
<div id="tags"></div>
<div id="err"><div><h2>La vue 3D ne peut pas démarrer</h2><p id="errt" style="color:#8196b8"></p></div></div>
<script type="module" src="/static/view3d.js"></script>
</body></html>
