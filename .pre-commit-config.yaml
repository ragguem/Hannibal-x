# Dépôt local, sans CI distante : ces crochets sont le contrôle de chaque commit.
# Installation : uv run pre-commit install
# Tout fonctionne hors ligne (outils verrouillés dans uv.lock, aucun dépôt de crochets à télécharger).
default_install_hook_types: [pre-commit]
# legacy/ est figé (ADR 0002) et interfaces/ vient de LOTUSim : aucun crochet ne les réécrit.
exclude: ^(legacy|interfaces)/
repos:
  - repo: local
    hooks:
      - id: check-added-large-files
        name: fichiers volumineux
        entry: uv run --frozen check-added-large-files --maxkb=2048
        language: system
      - id: check-merge-conflict
        name: marqueurs de conflit
        entry: uv run --frozen check-merge-conflict
        language: system
      - id: check-yaml
        name: YAML valide
        entry: uv run --frozen check-yaml --allow-multiple-documents
        language: system
        types: [yaml]
      - id: check-toml
        name: TOML valide
        entry: uv run --frozen check-toml
        language: system
        types: [toml]
      - id: check-json
        name: JSON valide
        entry: uv run --frozen check-json
        language: system
        types: [json]
      - id: end-of-file-fixer
        name: fin de fichier
        entry: uv run --frozen end-of-file-fixer
        language: system
        types: [text]
        exclude: packages\.lock\.json$
      - id: trailing-whitespace
        name: espaces en fin de ligne
        entry: uv run --frozen trailing-whitespace-fixer
        language: system
        types: [text]
      - id: detect-private-key
        name: clé privée
        entry: uv run --frozen detect-private-key
        language: system
        types: [text]
      - id: no-data-files
        name: aucune donnée hors dépôt
        entry: "Fichier de données refusé (voir docs/donnees-hors-depot.md)"
        language: fail
        files: (^|/)(kb|audit|eval_data)/|\.(wav|mp3|flac|ogg|gguf|safetensors|onnx|pt|bin|pdf)$
        exclude: ^docs/[^/]+\.pdf$

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        files: ^(apps|packages)/.*\.py$
      - id: lint-imports
        name: import-linter
        entry: uv run --frozen lint-imports
        language: system
        pass_filenames: false
        files: ^(apps|packages)/.*\.py$
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q -p no:cacheprovider
        language: system
        pass_filenames: false
        files: ^(apps|packages|eval)/|^pyproject\.toml$|^uv\.lock$
      - id: dotnet-format
        name: dotnet format (back-office)
        entry: dotnet format apps/backoffice/Hannibal.Backoffice.slnx --verify-no-changes
        language: system
        pass_filenames: false
        files: ^apps/backoffice/|^global\.json$
      - id: dotnet-test
        name: dotnet test (back-office)
        entry: dotnet test --solution apps/backoffice/Hannibal.Backoffice.slnx
        language: system
        pass_filenames: false
        files: ^apps/backoffice/|^packages/contracts/schemas/|^global\.json$
      - id: web-typecheck
        name: tsc (console web)
        entry: pnpm --dir apps/web run typecheck
        language: system
        pass_filenames: false
        files: ^apps/web/|^pnpm-lock\.yaml$
      - id: web-lint
        name: eslint (console web)
        entry: pnpm --dir apps/web run lint
        language: system
        pass_filenames: false
        files: ^apps/web/
      - id: web-test
        name: vitest (console web)
        entry: pnpm --dir apps/web run test
        language: system
        pass_filenames: false
        files: ^apps/web/|^apps/api/openapi\.json$
