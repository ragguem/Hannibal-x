<!doctype html><meta charset=utf-8><title>Hannibal 3D</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#06121c;color:#cfe;font:13px monospace}
#h{position:fixed;left:10px;top:8px;background:#0008;padding:6px 10px;border:1px solid #2a4;white-space:pre}</style>
<div id=h>HANNIBAL 3D - souris: tourner / molette: zoom - touche F: inverser l'avant
<span id=l></span></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {ColladaLoader} from 'three/addons/loaders/ColladaLoader.js';
const lbl=document.getElementById('l');
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(devicePixelRatio);document.body.appendChild(r.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec6e0);scene.fog=new THREE.Fog(0x9ec6e0,900,7000);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,20000);cam.position.set(-250,120,300);
const ctl=new OrbitControls(cam,r.domElement);ctl.maxPolarAngle=Math.PI*0.49;
scene.add(new THREE.HemisphereLight(0xffffff,0x1a3a55,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(300,500,200);scene.add(sun);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(40000,40000),new THREE.MeshStandardMaterial({color:0x0b4a6e,roughness:0.35,metalness:0.1}));
sea.rotation.x=-Math.PI/2;scene.add(sea);
const grid=new THREE.GridHelper(40000,400,0x2c6b8f,0x1d557a);grid.position.y=0.3;grid.material.transparent=true;grid.material.opacity=0.35;scene.add(grid);
addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

let proto=null,flip=false,data={};const ships={};
const es=new EventSource('/stream');es.onmessage=e=>{data=JSON.parse(e.data)};
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F'){flip=!flip;for(const n in ships)ships[n].fl.rotation.y=flip?Math.PI:0}});

function addShip(n){
 const g=new THREE.Group(),fl=new THREE.Group();fl.rotation.y=flip?Math.PI:0;
 let body;
 if(proto){body=proto.clone(true)}else{body=new THREE.Mesh(new THREE.BoxGeometry(142,14,16),new THREE.MeshStandardMaterial({color:0x889aa8}));body.position.y=2}
 fl.add(body);g.add(fl);scene.add(g);
 if(n==='hannibal'){const ring=new THREE.Mesh(new THREE.RingGeometry(85,90,48),new THREE.MeshBasicMaterial({color:0x4fd,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=1;g.add(ring)}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(400*3),3));geo.setDrawRange(0,0);
 const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:n==='hannibal'?0x44ffdd:0xbbeeff}));line.frustumCulled=false;scene.add(line);
 ships[n]={g,fl,line,pts:[],th:0,init:false};
}

function frame(){
 requestAnimationFrame(frame);
 let cx=0,cz=0,k=0,txt='';
 for(const n in data){
  if(!ships[n])addShip(n);
  const s=data[n],o=ships[n],tx=s.x,tz=-s.y,tt=(90-s.hdg)*Math.PI/180;
  if(!o.init){o.g.position.set(tx,0,tz);o.th=tt;o.init=true}
  o.g.position.x+=(tx-o.g.position.x)*0.2;o.g.position.z+=(tz-o.g.position.z)*0.2;
  let d=tt-o.th;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;o.th+=d*0.1;o.g.rotation.y=o.th;
  const p=o.pts,last=p[p.length-1];
  if(!last||Math.hypot(o.g.position.x-last[0],o.g.position.z-last[1])>8){
   p.push([o.g.position.x,o.g.position.z]);if(p.length>400)p.shift();
   const a=o.line.geometry.attributes.position;p.forEach((q,i)=>a.setXYZ(i,q[0],0.6,q[1]));a.needsUpdate=true;o.line.geometry.setDrawRange(0,p.length)}
  cx+=o.g.position.x;cz+=o.g.position.z;k++;
  txt+='\n'+n.padEnd(9)+String(Math.round(s.hdg)).padStart(3,'0')+'  '+(s.sog*1.944).toFixed(1)+' kn';
 }
 if(k){cx/=k;cz/=k;const dx=cx-ctl.target.x,dz=cz-ctl.target.z;ctl.target.x+=dx;ctl.target.z+=dz;cam.position.x+=dx;cam.position.z+=dz}
 lbl.textContent=txt;ctl.update();r.render(scene,cam);
}

new ColladaLoader().load('/fremm.dae',col=>{
 const m=col.scene,b=new THREE.Box3().setFromObject(m),sz=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
 const inner=new THREE.Group();inner.add(m);
 m.position.set(-c.x,-b.min.y,-c.z);
 inner.scale.setScalar(142/Math.max(sz.x,sz.z));
 if(sz.z>sz.x)inner.rotation.y=Math.PI/2;
 inner.position.y=-5;
 proto=inner;lbl.textContent='\nmodele FREMM charge';frame();
},undefined,err=>{lbl.textContent='\nmodele non charge, boites a la place';console.error(err);frame()});
</script>
