[project]
name = "hannibal-sim-bridge"
version = "0.2.0"
description = "Pont entre l'API Hannibal X et le monde simulé LOTUSim (ROS 2) ; monde cinématique sans ROS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hannibal-platform",
    "hannibal-contracts",
    "hannibal-core",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
]

[tool.uv.sources]
hannibal-platform = { workspace = true }
hannibal-contracts = { workspace = true }
hannibal-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hannibal_sim_bridge"]
