[project]
name = "hannibal-doctrine"
version = "0.6.0"
description = "Assistant de doctrine Hannibal X : réponses citées tirées des publications chargées, sinon refus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hannibal-platform",
    "hannibal-contracts",
    "hannibal-core",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "httpx>=0.28",
    "asyncpg>=0.30",
]

[tool.uv.sources]
hannibal-platform = { workspace = true }
hannibal-contracts = { workspace = true }
hannibal-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hannibal_doctrine"]
