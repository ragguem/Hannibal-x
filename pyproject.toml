[project]
name = "hannibal-x"
version = "0.2.0"
description = "Hannibal X — aide au commandement naval, monodépôt"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "mypy>=1.17",
    "types-pyyaml>=6.0",
    "import-linter>=2.3",
    "pre-commit>=4.2",
    "pre-commit-hooks>=6.0",
    "hannibal-platform",
    "hannibal-contracts",
    "hannibal-core",
    "hannibal-api",
    "hannibal-sim-bridge",
    "hannibal-asr",
    "hannibal-rerank",
    "hannibal-doctrine",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api", "services/sim_bridge", "services/asr", "services/rerank", "services/doctrine"]

[tool.uv.sources]
hannibal-platform = { workspace = true }
hannibal-contracts = { workspace = true }
hannibal-core = { workspace = true }
hannibal-api = { workspace = true }
hannibal-sim-bridge = { workspace = true }
hannibal-asr = { workspace = true }
hannibal-rerank = { workspace = true }
hannibal-doctrine = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy", "interfaces"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "PT", "SIM"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["hannibal_api", "hannibal_platform", "hannibal_contracts", "hannibal_sim_bridge", "hannibal_asr", "hannibal_rerank", "hannibal_doctrine"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"eval/**" = ["S101", "S310"]
# Repris tel quel de legacy/ au Lot 1 : on déplace d'abord, on améliore ensuite (plan § 9.2).
"packages/core/src/**" = ["E501", "E731", "RUF046", "RUF059", "B905"]
# Consignes des modèles reprises mot pour mot de legacy/v2 ; corpus d'exemple écrit d'un seul tenant.
"services/doctrine/src/hannibal_doctrine/application/prompts.py" = ["E501"]
"services/doctrine/src/hannibal_doctrine/infrastructure/sample.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/platform/src", "packages/contracts/src", "packages/core/src", "apps/api/src", "services/sim_bridge/src", "services/asr/src", "services/rerank/src", "services/doctrine/src"]
plugins = ["pydantic.mypy"]

# Code repris tel quel de legacy/ (Lot 1) : corps vérifiés, signatures typées au fil des lots.
[[tool.mypy.overrides]]
module = ["hannibal_core.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["dependency_injector.*", "asyncpg.*", "rclpy.*", "lotusim_msgs.*", "geographic_msgs.*", "geometry_msgs.*", "faster_whisper.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "services", "eval"]
pythonpath = ["eval/characterization", "eval/doctrine"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "data: nécessite les données hors dépôt (variables HX_KB, HX_TESTSET) ; ignoré sinon",
    "postgres: nécessite une base PostgreSQL jetable (variable HX_TEST_DATABASE_URL) ; ignoré sinon",
]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.importlinter]
root_packages = ["hannibal_api", "hannibal_platform", "hannibal_contracts", "hannibal_core", "hannibal_sim_bridge", "hannibal_asr", "hannibal_rerank", "hannibal_doctrine"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "API : couches hexagonales"
type = "layers"
layers = [
    "hannibal_api.socle",
    "hannibal_api.presentation | hannibal_api.infrastructure",
    "hannibal_api.application",
    "hannibal_api.domain",
]

[[tool.importlinter.contracts]]
name = "API : le domaine n'a aucune entrée-sortie"
type = "forbidden"
source_modules = ["hannibal_api.domain"]
forbidden_modules = ["hannibal_platform", "fastapi", "starlette", "sqlalchemy", "asyncpg", "httpx", "pydantic_settings"]

[[tool.importlinter.contracts]]
name = "API : l'application ne connaît pas le web ni la base"
type = "forbidden"
source_modules = ["hannibal_api.application"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "asyncpg", "httpx", "hannibal_api.infrastructure"]

[[tool.importlinter.contracts]]
name = "Core : aucune entrée-sortie, aucune application"
type = "forbidden"
source_modules = ["hannibal_core"]
forbidden_modules = [
    "hannibal_api", "hannibal_platform", "fastapi", "starlette", "sqlalchemy", "asyncpg", "httpx",
    "urllib", "socket", "subprocess",
]

[[tool.importlinter.contracts]]
name = "Platform et contracts ne dépendent d'aucune application"
type = "forbidden"
source_modules = ["hannibal_platform", "hannibal_contracts"]
forbidden_modules = ["hannibal_api", "hannibal_core", "hannibal_sim_bridge", "hannibal_asr", "hannibal_rerank", "hannibal_doctrine"]

[[tool.importlinter.contracts]]
name = "sim-bridge ne connaît pas l'API"
type = "forbidden"
source_modules = ["hannibal_sim_bridge"]
forbidden_modules = ["hannibal_api", "sqlalchemy", "asyncpg"]

[[tool.importlinter.contracts]]
name = "asr : couches hexagonales, sans l'API ni la base"
type = "layers"
layers = [
    "hannibal_asr.socle",
    "hannibal_asr.presentation | hannibal_asr.infrastructure",
    "hannibal_asr.application",
]

[[tool.importlinter.contracts]]
name = "asr ne connaît ni l'API, ni le noyau, ni la base"
type = "forbidden"
source_modules = ["hannibal_asr"]
forbidden_modules = ["hannibal_api", "hannibal_core", "hannibal_sim_bridge", "sqlalchemy", "asyncpg"]

[[tool.importlinter.contracts]]
name = "rerank : couches hexagonales, sans l'API ni la base"
type = "layers"
layers = [
    "hannibal_rerank.socle",
    "hannibal_rerank.presentation | hannibal_rerank.infrastructure",
    "hannibal_rerank.application",
]

[[tool.importlinter.contracts]]
name = "rerank ne connaît que platform et contracts"
type = "forbidden"
source_modules = ["hannibal_rerank"]
forbidden_modules = ["hannibal_api", "hannibal_core", "hannibal_doctrine", "hannibal_sim_bridge", "hannibal_asr", "sqlalchemy", "asyncpg"]

[[tool.importlinter.contracts]]
name = "doctrine : couches hexagonales"
type = "layers"
layers = [
    "hannibal_doctrine.socle",
    "hannibal_doctrine.presentation | hannibal_doctrine.infrastructure",
    "hannibal_doctrine.application",
]

[[tool.importlinter.contracts]]
name = "doctrine : l'application ne connaît pas le web ni la base"
type = "forbidden"
source_modules = ["hannibal_doctrine.application"]
forbidden_modules = ["fastapi", "starlette", "asyncpg", "httpx", "hannibal_platform"]

[[tool.importlinter.contracts]]
name = "doctrine ne connaît ni l'API, ni les autres services, ni SQLAlchemy"
type = "forbidden"
source_modules = ["hannibal_doctrine"]
forbidden_modules = ["hannibal_api", "hannibal_asr", "hannibal_sim_bridge", "hannibal_rerank", "sqlalchemy"]
