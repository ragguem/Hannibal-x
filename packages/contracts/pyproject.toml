[project]
name = "hannibal-contracts"
version = "0.1.0"
description = "Modèles d'échange de Hannibal X (HTTP, événements, intentions) ; source des schémas JSON publiés"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11"]

[project.scripts]
hx-export-schemas = "hannibal_contracts.export:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hannibal_contracts"]
