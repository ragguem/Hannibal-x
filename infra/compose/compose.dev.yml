# Poste de développement. Depuis la racine du dépôt :
#   docker compose -f infra/compose/compose.dev.yml --env-file infra/compose/dev.env up -d --build
#   docker compose -f infra/compose/compose.dev.yml --env-file infra/compose/dev.env --profile gpu up -d   # avec Ollama
name: hannibal-dev

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: hannibal
      POSTGRES_USER: hannibal
      POSTGRES_PASSWORD: ${HX_DEV_DB_PASSWORD:?définir HX_DEV_DB_PASSWORD dans dev.env}
    ports: ["127.0.0.1:${HX_DEV_DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hannibal -d hannibal"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256m
    mem_limit: 4g
    logging: *logging

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args: { VERSION: "${HX_VERSION:-0.1.0}" }
    image: hannibal/api:${HX_VERSION:-0.1.0}-dev
    command: ["hx-api-migrate"]
    healthcheck: { disable: true }
    environment:
      HX_API_DATABASE_URL: postgresql://hannibal:${HX_DEV_DB_PASSWORD}@postgres:5432/hannibal
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging: *logging

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args: { VERSION: "${HX_VERSION:-0.1.0}" }
    image: hannibal/api:${HX_VERSION:-0.1.0}-dev
    environment:
      HX_API_ENVIRONMENT: dev
      HX_API_ADAPTERS: ${HX_API_ADAPTERS:-real}
      HX_API_DATABASE_URL: postgresql://hannibal:${HX_DEV_DB_PASSWORD}@postgres:5432/hannibal
      HX_API_OLLAMA_URL: ${HX_API_OLLAMA_URL:-}
      HX_API_SIM_BRIDGE_URL: http://sim-bridge:8100
      HX_API_ASR_URL: http://asr:8200
      HX_API_RECORDINGS_DIR: /var/lib/hannibal/recordings
      HX_API_LOG_LEVEL: ${HX_API_LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:8000:8000"]
    volumes: [recordings:/var/lib/hannibal/recordings]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      sim-bridge: { condition: service_healthy }
      asr: { condition: service_started }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    logging: *logging

  sim-bridge:
    build:
      context: ../..
      dockerfile: services/sim_bridge/Dockerfile
      target: kinematic
      args: { VERSION: "${HX_VERSION:-0.2.0}" }
    image: hannibal/sim-bridge:${HX_VERSION:-0.2.0}-dev
    environment:
      HX_SIM_BRIDGE_ENVIRONMENT: dev
      HX_SIM_BRIDGE_WORLD: kinematic
      HX_SIM_BRIDGE_REGISTRY_PATH: /data/maneuvers.jsonl
      HX_SIM_BRIDGE_LOG_LEVEL: ${HX_API_LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:8100:8100"]
    volumes: [simbridge:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: *logging

  # Moteur scripté par défaut : HX_ASR_ENGINE=whisper dans dev.env pour Whisper sur processeur
  # (modèles téléchargés au premier démarrage dans le volume asrmodels).
  asr:
    build:
      context: ../..
      dockerfile: services/asr/Dockerfile
      target: cpu
      args: { VERSION: "${HX_VERSION:-0.5.0}" }
    image: hannibal/asr:${HX_VERSION:-0.5.0}-dev
    environment:
      HX_ASR_ENVIRONMENT: dev
      HX_ASR_ENGINE: ${HX_ASR_ENGINE:-scripted}
      HX_ASR_WHISPER_MODEL: ${HX_ASR_WHISPER_MODEL:-small}
      HX_ASR_LOG_LEVEL: ${HX_API_LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:8200:8200"]
    volumes: [asrmodels:/models]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    logging: *logging

  backoffice-migrate:
    build:
      context: ../..
      dockerfile: apps/backoffice/Dockerfile
      args: { VERSION: "${HX_VERSION:-0.2.0}" }
    image: hannibal/backoffice:${HX_VERSION:-0.2.0}-dev
    command: ["migratedb"]
    environment:
      HX_BACKOFFICE_ENVIRONMENT: dev
      HX_BACKOFFICE_ADAPTERS: real
      HX_BACKOFFICE_DATABASE_URL: Host=postgres;Port=5432;Database=hannibal;Username=hannibal;Password=${HX_DEV_DB_PASSWORD}
      HX_BACKOFFICE_API_URL: http://api:8000
      HX_BACKOFFICE_INITIAL_ADMIN_PASSWORD: ${HX_DEV_ADMIN_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging: *logging

  backoffice:
    build:
      context: ../..
      dockerfile: apps/backoffice/Dockerfile
      args: { VERSION: "${HX_VERSION:-0.2.0}" }
    image: hannibal/backoffice:${HX_VERSION:-0.2.0}-dev
    environment:
      HX_BACKOFFICE_ENVIRONMENT: dev
      HX_BACKOFFICE_ADAPTERS: ${HX_BACKOFFICE_ADAPTERS:-real}
      HX_BACKOFFICE_DATABASE_URL: Host=postgres;Port=5432;Database=hannibal;Username=hannibal;Password=${HX_DEV_DB_PASSWORD}
      HX_BACKOFFICE_API_URL: http://api:8000
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      backoffice-migrate: { condition: service_completed_successfully }
      api: { condition: service_started }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: *logging

  ollama:
    profiles: [gpu]
    image: ollama/ollama:0.35.1
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    logging: *logging

volumes:
  pgdata:
  simbridge:
  recordings:
  asrmodels:
  ollama:
