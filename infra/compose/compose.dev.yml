# Poste de développement. Depuis la racine du dépôt :
#   docker compose -f infra/compose/compose.dev.yml --env-file infra/compose/dev.env up -d --build
#   docker compose -f infra/compose/compose.dev.yml --env-file infra/compose/dev.env --profile gpu up -d   # avec Ollama
name: hannibal-dev

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: hannibal
      POSTGRES_USER: hannibal
      POSTGRES_PASSWORD: ${HX_DEV_DB_PASSWORD:?définir HX_DEV_DB_PASSWORD dans dev.env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hannibal -d hannibal"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256m
    mem_limit: 4g
    logging: *logging

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args: { VERSION: "${HX_VERSION:-0.1.0}" }
    image: hannibal/api:${HX_VERSION:-0.1.0}-dev
    environment:
      HX_API_ENVIRONMENT: dev
      HX_API_ADAPTERS: ${HX_API_ADAPTERS:-real}
      HX_API_DATABASE_URL: postgresql://hannibal:${HX_DEV_DB_PASSWORD}@postgres:5432/hannibal
      HX_API_OLLAMA_URL: ${HX_API_OLLAMA_URL:-}
      HX_API_LOG_LEVEL: ${HX_API_LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    logging: *logging

  ollama:
    profiles: [gpu]
    image: ollama/ollama:0.35.1
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    logging: *logging

volumes:
  pgdata:
  ollama:
