# /metrics n'est jamais routé par le proxy : collecte sur le réseau obs (et sim pour sim-bridge).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/rules.yml]

scrape_configs:
  - job_name: hannibal
    authorization:
      credentials_file: /run/secrets/metrics.token
    static_configs:
      - targets: ["api:8000"]
        labels: { service: api }
      - targets: ["asr:8200"]
        labels: { service: asr }
      - targets: ["rerank:8300"]
        labels: { service: rerank }
      - targets: ["doctrine:8400"]
        labels: { service: doctrine }
      - targets: ["backoffice:8080"]
        labels: { service: backoffice }
      - targets: ["172.21.0.1:8100"]
        labels: { service: sim-bridge }

  - job_name: gpu
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
