schema_version: 1
id: exercice_formations
titre: Exercice de formations
niveau: Intermédiaire
duree_s: 1900
resume: Cinq changements de formation à la suite, tirés au hasard. Le suivant arrive dès que tous les navires sont en station.
briefing: >
  Situation : entraînement aux signaux de formation. La direction de l'exercice annonce une formation en clair ;
  à vous de donner le bon signal à la flotte. Dès que tous les navires sont en station, la formation suivante est annoncée.
  Si vous hésitez, le signal attendu est donné en indice à mi-délai. Les formations changent à chaque partie.
formation_depart: column
cap_initial: 0
vitesse_initiale_kn: 14
etapes_aleatoires: 5
etapes_delai_s: 300
etapes:
  - { key: column, ordre: "FORM 1", texte: "Colonne" }
  - { key: line_abreast_stbd, ordre: "FORM 3", texte: "Ligne de front sur tribord" }
  - { key: line_abreast_port, ordre: "FORM 4", texte: "Ligne de front sur bâbord" }
  - { rel_tens: [10, 11, 12, 13, 14, 15] }
  - { rel_tens: [10, 11, 12, 13, 14, 15] }
flotte:
  - { nom: hannibal, role: guide }
  - { nom: alfa, role: escorte }
  - { nom: charlie, role: escorte }
  - { nom: delta, role: escorte }
