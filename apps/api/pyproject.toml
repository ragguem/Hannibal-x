[project]
name = "hannibal-api"
version = "0.2.0"
description = "API Hannibal X : point d'entrée unique du poste, orchestration des domaines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hannibal-platform",
    "hannibal-contracts",
    "hannibal-core",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "asyncpg>=0.30",
    "dependency-injector>=4.48",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.scripts]
hx-export-openapi = "hannibal_api.socle.openapi:main"

[tool.uv.sources]
hannibal-platform = { workspace = true }
hannibal-contracts = { workspace = true }
hannibal-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hannibal_api"]
